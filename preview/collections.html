<!doctype html><html lang="ja"><meta charset="utf-8"><title>一覧・グラフの概要 — ローカル検証</title>
<style>
body{font:14px/1.5 sans-serif;color:#283748;margin:0;background:#f7f8fa}header{background:#ffe000;padding:18px 28px;font-weight:bold}main{margin:28px auto;max-width:1120px;background:white;padding:24px}h1{font-size:24px}nav{display:flex;border-bottom:2px solid #ddd;margin-bottom:20px}nav button{font:16px sans-serif;color:#2672aa;background:white;border:0;padding:18px 25px;cursor:pointer}nav button[aria-selected=true]{border-bottom:3px solid #2672aa}section[hidden]{display:none}table{border-collapse:collapse;width:100%;margin-top:24px}td,th{padding:12px 16px;border-bottom:1px solid #ddd;text-align:left}td:first-child{width:24px}td:last-child{width:190px;white-space:nowrap}td button{background:none;border:0;color:#2875ad;font:14px sans-serif;cursor:pointer}tbody tr:hover{background:#edf6fd}p{color:#526479}.nrfd-row-tools button{border:1px solid currentColor}
</style><header>Nest Rec / ローカルデモ・架空データ</header><main><h1>アプリの設定</h1>
<nav role="tablist"><button role="tab" id="form" aria-selected="false">フォーム</button><button role="tab" id="view" aria-selected="true">一覧</button><button role="tab" id="report" aria-selected="false">グラフ</button><button role="tab" id="settings" aria-selected="false">設定</button></nav>
<section role="tabpanel" aria-labelledby="view"><button>一覧を追加する</button><div data-testid="viewTable"><table><thead><tr><th></th><th>作成済みの一覧</th><th>操作</th></tr></thead><tbody><tr><td><button title="並べ替え">⠿</button></td><td>進行中案件</td><td><button class="edit">編集</button>　<button>複製</button>　<button>削除</button></td></tr><tr><td></td><td>（すべて）</td><td><button disabled>編集</button>　<button disabled>複製</button>　<button disabled>削除</button></td></tr></tbody></table></div></section>
<section role="tabpanel" aria-labelledby="report" hidden><button>グラフを追加する</button><div data-testid="reportTable"><table><thead><tr><th></th><th>作成済みのグラフ</th><th>操作</th></tr></thead><tbody><tr><td></td><td>集計</td><td><button class="edit">編集</button>　<button>複製</button>　<button>削除</button></td></tr></tbody></table></div></section>
<section role="tabpanel" aria-labelledby="form" hidden><p>フォーム用のデモは既存の別ページを使います。</p></section><section role="tabpanel" aria-labelledby="settings" hidden><p>設定メニューのチップは既存の別ページを使います。</p></section>
<p role="status" id="native-status">標準操作の確認用です。保存処理はありません。</p></main><script>
for(const tab of document.querySelectorAll('[role="tab"]')) tab.addEventListener('click',()=>{for(const t of document.querySelectorAll('[role="tab"]'))t.setAttribute('aria-selected',String(t===tab));for(const p of document.querySelectorAll('[role="tabpanel"]'))p.hidden=p.getAttribute('aria-labelledby')!==tab.id;});
for(const b of document.querySelectorAll('.edit'))b.addEventListener('click',()=>document.querySelector('#native-status').textContent='標準の編集操作を受け付けました。');
</script><script src="/kintoneConfigLens.user.js"></script></html>
